name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      host_repo:
        description: CLIProxyAPI repo to build against
        default: router-for-me/CLIProxyAPI
      host_ref:
        description: CLIProxyAPI ref to build against
        default: main

env:
  GOFLAGS: -mod=mod
  HOST_REPO: ${{ inputs.host_repo || 'router-for-me/CLIProxyAPI' }}
  HOST_REF: ${{ inputs.host_ref || 'main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: plugin
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.HOST_REPO }}
          ref: ${{ env.HOST_REF }}
          path: CLIProxyAPI
      - uses: actions/setup-go@v7
        with:
          go-version-file: plugin/go.mod
          cache-dependency-path: plugin/go.sum
      - run: go test ./...
        working-directory: plugin

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - {
              name: linux_amd64,
              os: ubuntu-latest,
              goos: linux,
              goarch: amd64,
              ext: so,
            }
          - {
              name: linux_arm64,
              os: ubuntu-latest,
              goos: linux,
              goarch: arm64,
              ext: so,
              cc: aarch64-linux-gnu-gcc,
              cflags: "-march=armv8-a",
            }
          - {
              name: windows_amd64,
              os: windows-latest,
              goos: windows,
              goarch: amd64,
              ext: dll,
            }
          - {
              name: darwin_amd64,
              os: macos-latest,
              goos: darwin,
              goarch: amd64,
              ext: dylib,
            }
          - {
              name: darwin_arm64,
              os: macos-latest,
              goos: darwin,
              goarch: arm64,
              ext: dylib,
            }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: plugin
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.HOST_REPO }}
          ref: ${{ env.HOST_REF }}
          path: CLIProxyAPI
      - uses: actions/setup-go@v7
        with:
          go-version-file: plugin/go.mod
          cache-dependency-path: plugin/go.sum

      - name: Install arm64 cross compiler
        if: matrix.name == 'linux_arm64'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF#refs/tags/v}"; else v="dev"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Build
        shell: bash
        working-directory: plugin
        env:
          CGO_ENABLED: "1"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CC: ${{ matrix.cc }}
          CGO_CFLAGS: ${{ matrix.cflags || (matrix.goarch == 'amd64' && '-march=x86-64') || '' }}
        run: |
          mkdir -p out
          go build -buildmode=c-shared -o out/mythos.${{ matrix.ext }} .

      - name: Package (zip)
        if: matrix.goos != 'windows'
        shell: bash
        working-directory: plugin/out
        run: zip mythos_${{ steps.ver.outputs.version }}_${{ matrix.name }}.zip mythos.${{ matrix.ext }}

      - name: Package (zip, windows)
        if: matrix.goos == 'windows'
        shell: pwsh
        working-directory: plugin/out
        run: Compress-Archive -Path mythos.dll -DestinationPath mythos_${{ steps.ver.outputs.version }}_${{ matrix.name }}.zip

      - uses: actions/upload-artifact@v7
        with:
          name: mythos_${{ matrix.name }}
          path: plugin/out/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum *.zip > checksums.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
